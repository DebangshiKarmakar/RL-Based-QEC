[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qecrl"
version = "0.1.0"
description = "RL Decoder and Baseline Evaluation for Surface Code"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=1.0.0",
    "numpy>=1.24.0",
    "pymatching>=2.0.0",
    "PyYAML>=6.0",
    "pytest>=7.0.0",
    "stim>=1.12.0",
    "matplotlib>=3.8.0",
    "streamlit>=1.30.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
